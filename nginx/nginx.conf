worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS server. Re-resolve "app" every 5 s, so replicas
    # added with `docker compose up -d --scale app=N` are picked up automatically.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app_backend {
        zone app_backend 64k;
        # Default algorithm: round robin. Try `least_conn;` in Lab 2.
        server app:3000 resolve;
    }

    log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout upstream;

    server {
        listen 80;

        # Health endpoint of the load balancer itself
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
